<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit Locker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Page header -->
    <header class="card header-card">
      <h1>🎒 Kit Locker</h1>
      <p class="subtitle">Book and return club kit in seconds ✨</p>
    </header>

    <!-- Member name -->
    <section class="card">
      <h2>👤 Who are you?</h2>
      <div class="inner-box">
        <label for="member-name">Your name</label>
        <input type="text" id="member-name" placeholder="Enter your name..." autocomplete="name">
      </div>
    </section>

    <!-- One-line message shown after each action -->
    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

    <!-- Kit list with category filter -->
    <section class="card">
      <h2>📦 Browse kit</h2>
      <div id="category-filters" class="filters"></div>
      <div class="inner-box table-wrapper">
        <table class="kit-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="kit-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Bookings for the current name -->
    <section class="card">
      <h2>📋 My bookings</h2>
      <div class="inner-box">
        <ul id="my-bookings" class="bookings-list"></ul>
        <p id="no-bookings-message" class="empty-message"></p>
      </div>
    </section>

    <!-- Reset -->
    <footer class="footer">
      <button type="button" id="reset-button" class="button button-secondary">Reset all</button>
    </footer>

  </div>

  <!-- data.js must load before app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
